[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-gr"
version = "0.3.0"
description = "vLLM-based Generative Recommender Inference Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "vllm-GR Authors"},
]
keywords = ["machine-learning", "recommender-systems", "inference", "vllm", "hstu", "dlrm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies - required for vllm-GR to function
# Versions aligned with vllm 0.14.1 ecosystem
dependencies = [
    "torch==2.9.1",
    "numpy>=2.2.0",
    "msgspec",
    "tqdm>=4.66.0",
    "opencv-python-headless>=4.13.0",
    "vllm==0.14.1",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
# TorchRec for distributed embeddings
torchrec = [
    "torchrec==1.4.0",
]
# SafeTensors for model loading
safetensors = [
    "safetensors>=0.4.5",
]
# Serving (future extension)
serving = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.12.0",
]
# Full installation with all optional dependencies
all = [
    "vllm-gr[dev,safetensors]",
]

[project.urls]
Homepage = "https://github.com/your-org/vllm-GR"
Documentation = "https://github.com/your-org/vllm-GR#readme"
Repository = "https://github.com/your-org/vllm-GR.git"
Issues = "https://github.com/your-org/vllm-GR/issues"

[project.entry-points."vllm.general_plugins"]
vllm_gr = "vllm_gr.plugin:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_gr*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
